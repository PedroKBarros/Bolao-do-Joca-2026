<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BDJ 2026</title>
    <link href="/frontend/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/app-theme.css" rel="stylesheet">
  </head>
  <body>
    <div class="container app-container">
      <header class="container d-flex justify-content-center align-items-center">
        <img src="/frontend/assets/img/logo_sem_fundo.png" class="img-fluid" alt="Logo" style="width: 300px;height: 300px;">
      </header>

      <main>
        <div class="row d-flex justify-content-center align-items-center">
          <div class="col-12 text-center"><p class="app-big-txt app-blue-txt app-bottom-separation">BEM VINDO!</p></div>
        </div>
        <div class="row d-flex justify-content-center align-items-center">
          <div class="col-12 text-center"><p class="app-big-txt app-yellow-txt app-zero-separation">Já tem cadastro? Só entrar:</p></div>
          <div class="col-12 text-center"><button id="login" type="button" class="app-btn app-big-btn app-positive-btn-color">entrar</button></div>
        </div>
        <div class="row d-flex justify-content-center align-items-center">
          <div class="col-12 text-center"><p class="app-big-txt app-yellow-txt app-height-separation">OU</p></div>
        </div>
        <div class="row d-flex justify-content-center align-items-center">
          <div class="col-12 text-center"><p class="app-big-txt app-yellow-txt app-zero-separation">Não tem cadastro? Só fazer:</p></div>
        </div>
        <div class="row d-flex justify-content-center align-items-center">
          <div class="col-12 text-center"><button id="register" type="button" class="app-btn app-big-btn app-positive-btn-color">criar cadastro</button></div>
        </div>
      </main>
    </div>
    <script src="/frontend/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/frontend/assets/js/index.js"></script>
    <script type="module" src="/frontend/assets/js/config.js"> </script>
    <script type="module" src="/frontend/assets/js/common.js"></script>

</html>
