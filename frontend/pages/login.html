<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BDJ 2026 - Cadastro</title>
    <link href="/frontend/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/app-theme.css" rel="stylesheet">
  </head>
  <body>
    <div class="container app-container">
        <header class="container d-flex justify-content-center align-items-center">
        <img src="../assets/img/logo_sem_fundo.png" class="img-fluid" alt="Logo" style="width: 300px;height: 300px;">
        </header>

        <main>
            <!-- A div container abaixo serve apenas para que as labels fiquem alinhadas 
             a esquerda, não sendo necessário em todas as páginas.
             Obs.: ela só cumprirá esse objetivo se os elementos de maior 
             largura da página forem os campos. -->
            <div class="container app-restrict-container mx-auto">
                <div class="row d-flex justify-content-center align-items-center">
                    <div class="col-12 text-center"><p class="app-big-txt app-blue-txt app-bottom-separation">LOGIN</p></div>
                </div>
                <div class="row d-flex justify-content-center align-items-center">
                    <div class="col-12 text-start">
                        <label for="whatsapp-num" class="app-big-txt app-yellow-txt app-top-separation">Número do Whatsapp:</label>
                    </div>
                </div>
                <div class="row d-flex justify-content-center align-items-center">
                    <div class="col-12 text-center">
                        <input type="text" class="app-field app-big-field" id="whatsapp-num" placeholder="">
                    </div>
                </div>
                <div class="row d-flex justify-content-center align-items-center">
                    <div class="col-12 text-start">
                        <label for="password" class="app-big-txt app-yellow-txt app-top-separation">Senha:</label>
                    </div>
                </div>
                <div class="row d-flex justify-content-center align-items-center">
                    <div class="col-12 text-center">
                        <input type="password" class="app-field app-big-field" id="password" placeholder="">
                    </div>
                </div>
                <div class="row d-flex justify-content-center align-items-center">
                <div class="col-12 text-center"><button id="login-confirm" type="button" class="app-btn app-big-btn app-positive-btn-color app-height-separation">Entrar</button></div>
                </div>
            </div>
            <!--O html da div abaixo é adicionado dinamicamente via fetch 
            do /frontend/assets/components/modal.html-->
            <div id="modalComponent"></div>

        </main>
    </div>
    <script src="/frontend/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/frontend/assets/js/common.js"></script>
    <script type="module" src="/frontend/assets/js/login.js"></script>
  </body>
</html>
