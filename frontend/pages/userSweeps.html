<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BDJ 2026 - Cadastro</title>
    <link href="/frontend/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/app-theme.css" rel="stylesheet">
  </head>
  <body data-page="userSweeps">
    <div class="container app-container">
        <header>
            <div class="app-blue-bg d-flex align-items-center">
                <img src="/frontend/assets/img/logo_sem_fundo.png" class="img-fluid app-logo-header-after-login" alt="Logo">
                <p class="app-big-txt app-white-txt app-zero-separation ms-2">BOLÃO DO JOCA 2026</p>
            </div>
            <div class="app-white-bg row d-flex justify-content-center align-items-center">
                <div class="col-12 text-left">
                    <p id="welcome-msg" class="app-left-separation app-big-txt app-blue-txt app-zero-separation">Bem vindo, Fulano!</p>
                </div>
            </div>
        </header>

        <main>
            <div class="row d-flex justify-content-center align-items-center">
                <div class="col-12 text-center">
                    <button id="create-sweepstacke" type="button" class="app-btn app-medium-btn app-neutral-btn-color app-height-separation">
                        CRIAR BOLÃO
                    </button>
                    <button id="sigin-sweepstacke" type="button" class="app-btn app-medium-btn app-neutral-btn-color app-height-separation app-left-separation">
                        ENTRAR EM BOLÃO
                    </button>
                </div>
            </div>
            <!--Na div abaixo é inserido dinamicamente os bolões do usuário 
            ou a arte indicando que o usuário não possui bolões-->
            <div id="sweepsArea"></div>





            <!--O html da div abaixo é adicionado dinamicamente via fetch 
            do /frontend/assets/components/modal.html-->
            <div id="modalComponent"></div>
        </main>
    </div>
    <script src="/frontend/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/frontend/assets/js/main.js"></script>
  </body>
</html>
